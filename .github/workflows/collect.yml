name: Collect public trend signals
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trend-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect real public RSS signals (failures recorded)
        shell: bash
        run: |
          mkdir -p reports data/history
          set +e
          python -m engine.cli collect --markets GB,JP,KR --json > reports/last-run.json
          code=$?
          echo "$code" > reports/last-exit-code.txt
          exit 0
      - name: Export observed evidence and collection status
        shell: bash
        run: |
          DAY=$(date -u +%F)
          python -m engine.cli export --date "$DAY" --out "data/history/$DAY.json"
          python -m engine.cli health > reports/latest-health.md
      - name: Commit dated observations and auditable failures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "data: capture public trend source results"
            git push
          fi
      - name: Mark missing/failed feeds as failure
        shell: bash
        run: |
          test "$(cat reports/last-exit-code.txt)" = "0"
