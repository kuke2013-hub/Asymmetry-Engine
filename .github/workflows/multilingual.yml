name: Multilingual AI inference — local CPU
on:
  push:
    branches: [main]
    paths:
      - 'engine/multilingual.py'
      - '.github/workflows/multilingual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free on-device inference engine
        run: python -m pip install 'fastembed>=0.6,<1'
      - name: Classify actual observed multilingual market terms
        shell: bash
        run: |
          INPUT=$(find data/history -maxdepth 1 -name '20*.json' | sort | tail -1)
          test -n "$INPUT"
          python -m engine.multilingual --input "$INPUT" --out reports/ai-latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: multilingual-classification
          path: reports/ai-latest.json
          retention-days: 7
