name: Python tests
on:
  push:
    paths-ignore:
      - 'data/history/**'
      - 'reports/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q engine tests
      - name: Run isolated tests without credentials
        run: python -m unittest discover -s tests -v
